<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HomeLink</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="HomeLink - Your one-stop platform for home improvement products and professional installation services.">
  <meta name="theme-color" content="#0f2b5b">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Installable on a phone home screen. Android/Chrome reads the manifest;
       iOS Safari ignores most of it and needs its own tags, which is why the
       apple-* lines below duplicate what the manifest already says.
       `black-translucent` puts the status bar over our navy top bar, which the
       shell's env(safe-area-inset-top) padding already accounts for. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HomeLink">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <!-- Google Identity Services: renders the "Sign in with Google" button on login (web only —
       see login.ts, which never initializes it inside the native Capacitor WebView). -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Pre-boot splash. Everything inside <app-root> is discarded the moment Angular
       bootstraps, so this only ever covers the gap between first paint and the real
       SplashScreen component — matched to it (same navy field, same HomeLink mark) so
       the handoff is invisible. Inline because a stylesheet request would land too
       late to prevent the white flash it exists to prevent. -->
  <style>
    html, body { margin: 0; background: #0f2b5b; }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      background: radial-gradient(120% 90% at 50% 8%, #1a4a8a 0%, #0f2b5b 48%, #0a1f42 100%);
      font-family: Archivo, system-ui, sans-serif;
    }
    #boot-splash .boot-mark {
      width: 7rem;
      height: auto;
      overflow: visible;
      animation: bootPulse 1.6s ease-in-out infinite;
    }
    #boot-splash .boot-word {
      font-size: 2.125rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      color: #fff;
    }
    #boot-splash .boot-word span { color: #ff6b35; }
    @keyframes bootPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.94); opacity: 0.82; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .boot-mark { animation: none; }
    }
  </style>
</head>
<body>
  <app-root>
    <div id="boot-splash">
      <svg class="boot-mark" viewBox="0 0 190 162" aria-hidden="true">
        <g fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round">
          <path d="M3 79.88L94.92 7.5Q100 2.9 105.08 7.5L148 41.3L148 26L171.5 26L171.5 59.8L187 72L187 105.1L100 32.6L46 75.12L46 118L99 118L41.25 156.5L39 156.5A20 20 0 0 1 19 136.5L19 89L3 89Z" />
          <rect x="79" y="63.5" width="15.5" height="15.5" rx="1.2" stroke="none" />
          <rect x="98.5" y="63.5" width="15.5" height="15.5" rx="1.2" stroke="none" />
          <rect x="79" y="83" width="15.5" height="15.5" rx="1.2" stroke="none" />
          <rect x="98.5" y="83" width="15.5" height="15.5" rx="1.2" stroke="none" />
        </g>
        <path d="M51 157.43L146.28 157.43A33.63 33.63 0 0 0 179.45 118.27L156.63 129.69A12.52 12.52 0 0 1 145.43 107.29L166.36 96.82A33.63 33.63 0 0 0 113.34 117Z" fill="#ff6b35" stroke="#ff6b35" stroke-width="2" stroke-linejoin="round" />
      </svg>
      <p class="boot-word">Home<span>Link</span></p>
    </div>
  </app-root>
</body>
</html>
