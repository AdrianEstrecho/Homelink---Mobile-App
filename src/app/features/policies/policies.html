<div class="px-4 py-4">
  <div class="text-center mb-4">
    <p class="eyebrow justify-center mb-2"><svg lucideShield class="w-3.5 h-3.5"></svg> Trust &amp; Safety</p>
    <p class="text-gray-500 text-sm">Your trust and satisfaction are our priority.</p>
  </div>
  <div class="divide-y divide-gray-100 card">
    @for (p of policies; track p.title) {
      <div class="p-4 flex gap-3.5">
        @switch (p.icon) {
          @case ('refresh') { <svg lucideRefreshCw class="w-5 h-5 text-brand-navy shrink-0 mt-1"></svg> }
          @case ('headphones') { <svg lucideHeadphones class="w-5 h-5 text-brand-navy shrink-0 mt-1"></svg> }
          @case ('lock') { <svg lucideLock class="w-5 h-5 text-brand-navy shrink-0 mt-1"></svg> }
          @case ('x-circle') { <svg lucideCircleX class="w-5 h-5 text-brand-navy shrink-0 mt-1"></svg> }
        }
        <div>
          <h2 class="font-display font-bold text-base text-brand-ink mb-1.5">{{ p.title }}</h2>
          <p class="text-gray-500 leading-relaxed text-sm">{{ p.content }}</p>
        </div>
      </div>
    }
  </div>
</div>
