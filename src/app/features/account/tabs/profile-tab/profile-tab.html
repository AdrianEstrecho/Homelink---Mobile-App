<div>
  <div class="flex items-center justify-between mb-6">
    <h2 class="font-display font-bold text-lg text-brand-ink">Profile Details</h2>
    @if (!editing()) {
      <button type="button" (click)="startEdit()" class="flex items-center gap-1.5 text-sm font-semibold text-brand-navy hover:text-brand-orange transition">
        <svg lucidePencil class="w-4 h-4"></svg> Edit Profile
      </button>
    } @else {
      <button type="button" (click)="cancelEdit()" class="flex items-center gap-1.5 text-sm font-semibold text-gray-500 hover:text-gray-700 transition">
        <svg lucideX class="w-4 h-4"></svg> Cancel
      </button>
    }
  </div>

  @if (editing()) {
    <form (submit)="$event.preventDefault(); handleSave()" class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1.5 text-gray-700">First Name</label>
          <input [ngModel]="form().firstName" (ngModelChange)="updateField('firstName', $event)" name="firstName" class="input-field" required />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5 text-gray-700">Last Name</label>
          <input [ngModel]="form().lastName" (ngModelChange)="updateField('lastName', $event)" name="lastName" class="input-field" required />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5 text-gray-700">Phone Number</label>
        <input [ngModel]="form().phone" (ngModelChange)="updateField('phone', $event)" name="phone" class="input-field" placeholder="09XXXXXXXXX" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5 text-gray-700">Address</label>
        <textarea [ngModel]="form().address" (ngModelChange)="updateField('address', $event)" name="address" rows="2" class="input-field"></textarea>
      </div>
      <button type="submit" [disabled]="saving()" class="btn-primary flex items-center gap-2 disabled:opacity-60">
        <svg lucideSave class="w-4 h-4"></svg> {{ saving() ? 'Saving...' : 'Save Changes' }}
      </button>
    </form>
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="flex items-start gap-3 p-4 rounded-xl bg-gray-50 border border-gray-100">
        <div class="w-9 h-9 rounded-lg bg-white flex items-center justify-center shrink-0 border border-gray-100"><svg lucideUser class="w-4 h-4 text-brand-navy"></svg></div>
        <div class="min-w-0">
          <p class="text-[11px] uppercase tracking-wide text-gray-400 font-medium mb-0.5">Full Name</p>
          <p class="text-sm font-semibold text-gray-800 truncate">{{ (user()?.firstName + ' ' + user()?.lastName).trim() || 'Not set' }}</p>
        </div>
      </div>
      <div class="flex items-start gap-3 p-4 rounded-xl bg-gray-50 border border-gray-100">
        <div class="w-9 h-9 rounded-lg bg-white flex items-center justify-center shrink-0 border border-gray-100"><svg lucideMail class="w-4 h-4 text-brand-navy"></svg></div>
        <div class="min-w-0">
          <p class="text-[11px] uppercase tracking-wide text-gray-400 font-medium mb-0.5">Email Address</p>
          <p class="text-sm font-semibold text-gray-800 truncate">{{ user()?.email }}</p>
        </div>
      </div>
      <div class="flex items-start gap-3 p-4 rounded-xl bg-gray-50 border border-gray-100">
        <div class="w-9 h-9 rounded-lg bg-white flex items-center justify-center shrink-0 border border-gray-100"><svg lucidePhone class="w-4 h-4 text-brand-navy"></svg></div>
        <div class="min-w-0">
          <p class="text-[11px] uppercase tracking-wide text-gray-400 font-medium mb-0.5">Phone Number</p>
          <p class="text-sm font-semibold text-gray-800 truncate">{{ user()?.phone || 'Not set' }}</p>
        </div>
      </div>
      <div class="flex items-start gap-3 p-4 rounded-xl bg-gray-50 border border-gray-100">
        <div class="w-9 h-9 rounded-lg bg-white flex items-center justify-center shrink-0 border border-gray-100"><svg lucideMapPin class="w-4 h-4 text-brand-navy"></svg></div>
        <div class="min-w-0">
          <p class="text-[11px] uppercase tracking-wide text-gray-400 font-medium mb-0.5">Address</p>
          <p class="text-sm font-semibold text-gray-800 truncate">{{ user()?.address || 'Not set' }}</p>
        </div>
      </div>
    </div>
  }
</div>
