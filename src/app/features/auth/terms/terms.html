<div class="px-4 py-4">
  <div class="text-center mb-4">
    <p class="eyebrow justify-center mb-2"><svg lucideFileText class="w-3.5 h-3.5"></svg> Legal</p>
    <p class="text-gray-500 text-sm">Please read these terms carefully before using HomeLink.</p>
  </div>
  <div class="space-y-3">
    @for (s of sections; track s.title) {
      <div class="card p-4">
        <h2 class="font-display font-bold text-base text-brand-ink mb-1.5">{{ s.title }}</h2>
        <p class="text-gray-500 leading-relaxed text-sm">{{ s.content }}</p>
      </div>
    }
  </div>
</div>
