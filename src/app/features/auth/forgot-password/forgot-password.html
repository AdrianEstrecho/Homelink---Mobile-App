<app-auth-layout
  title="Forgot your password?"
  subtitle="Don't worry, happens to all of us. Enter your email below to recover your password"
  backTo="/login"
>
  <form (ngSubmit)="onSubmit()" class="space-y-5">
    <div>
      <label class="block text-sm font-medium mb-1.5">Email</label>
      <input type="email" name="email" required autofocus [(ngModel)]="email" class="input-field" />
    </div>
    @if (error()) {
      <p class="text-red-600 text-sm">{{ error() }}</p>
    }
    <button type="submit" [disabled]="loading()" class="btn-primary w-full flex items-center justify-center gap-2 py-3 disabled:opacity-50">
      <svg lucideKeyRound class="w-4 h-4"></svg> {{ loading() ? 'Sending...' : 'Submit' }}
    </button>
  </form>
</app-auth-layout>
