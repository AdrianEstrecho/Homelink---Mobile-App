<app-auth-layout title="Login" subtitle="Login to access your HomeLink account">
  <app-auth-illustration illustration>
    <svg icon lucideLock></svg>
    <svg badge lucideShieldCheck></svg>
  </app-auth-illustration>

  <form (ngSubmit)="onSubmit()" class="space-y-5">
    <div>
      <label class="block text-sm font-medium mb-1.5">Email</label>
      <input type="email" name="email" required [(ngModel)]="email" class="input-field" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1.5">Password</label>
      <input type="password" name="password" required [(ngModel)]="password" class="input-field" />
      <div class="flex justify-end mt-1.5">
        <a routerLink="/forgot-password" class="text-xs text-brand-orange font-medium hover:underline">Forgot Password?</a>
      </div>
    </div>
    @if (error()) {
      <p class="text-red-600 text-sm">{{ error() }}</p>
    }
    <button type="submit" [disabled]="loading()" class="btn-primary w-full flex items-center justify-center gap-2 py-3 disabled:opacity-70 transition-opacity">
      @if (loading()) {
        <svg lucideLoaderCircle class="w-4 h-4 animate-spin"></svg>
      } @else {
        <svg lucideLogIn class="w-4 h-4"></svg>
      }
      {{ loading() ? 'Signing in...' : 'Login' }}
    </button>
    <p class="text-center text-sm text-gray-600">
      Don't have an account? <a routerLink="/register" class="text-brand-orange font-semibold hover:underline">Sign up</a>
    </p>
  </form>
</app-auth-layout>
