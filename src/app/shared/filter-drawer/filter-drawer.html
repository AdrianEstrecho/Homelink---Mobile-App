<div class="app-overlay-frame fixed inset-0 z-[100]">
  <div class="absolute inset-0 bg-brand-navy/50 backdrop-blur-sm" (click)="closed.emit()"></div>
  <aside class="slide-in-right absolute inset-y-0 right-0 w-[19rem] max-w-[86vw] bg-white shadow-2xl flex flex-col" role="dialog" aria-modal="true" [attr.aria-label]="title()">
    <div class="flex items-center justify-between px-4 py-4 border-b border-gray-100 shrink-0 pt-[calc(1rem+env(safe-area-inset-top))]">
      <h2 class="flex items-center gap-2 font-display text-base font-bold text-brand-ink">
        <svg lucideSlidersHorizontal class="w-4 h-4 text-brand-orange"></svg> {{ title() }}
      </h2>
      <button type="button" (click)="closed.emit()" aria-label="Close filters" class="tap p-1.5 rounded-lg">
        <svg lucideX class="w-5 h-5 text-gray-500"></svg>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto py-3">
      @if (categories().length > 0) {
        <p class="px-4 pb-2 text-[11px] font-semibold uppercase tracking-[0.14em] text-gray-400">Category</p>
        <button
          type="button"
          (click)="categoryChange.emit('')"
          [attr.aria-pressed]="!activeCategory()"
          class="tap w-full flex items-center gap-3 px-4 py-2.5 text-left"
          [class]="!activeCategory() ? 'bg-brand-orange/10' : ''"
        >
          <span class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0" [class]="!activeCategory() ? 'bg-brand-orange/15 text-brand-orange' : 'bg-brand-navy/5 text-brand-navy'">
            <svg lucideLayoutGrid class="w-4 h-4"></svg>
          </span>
          <span class="flex-1 text-sm" [class]="!activeCategory() ? 'font-semibold text-brand-navy' : 'text-gray-700'">All categories</span>
          @if (!activeCategory()) {
            <svg lucideCheck class="w-4 h-4 text-brand-orange"></svg>
          }
        </button>
        @for (c of categories(); track c.key) {
          @let active = c.key === activeCategory();
          <button
            type="button"
            (click)="categoryChange.emit(c.key)"
            [attr.aria-pressed]="active"
            class="tap w-full flex items-center gap-3 px-4 py-2.5 text-left"
            [class]="active ? 'bg-brand-orange/10' : ''"
          >
            <span class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0" [class]="active ? 'bg-brand-orange/15 text-brand-orange' : 'bg-brand-navy/5 text-brand-navy'">
              @if (categoryKind() === 'service') {
                <app-service-category-icon [category]="c.key" class="w-4 h-4" />
              } @else {
                <app-category-icon [slug]="c.key" class="w-4 h-4" />
              }
            </span>
            <span class="flex-1 min-w-0 text-sm truncate" [class]="active ? 'font-semibold text-brand-navy' : 'text-gray-700'">{{ c.label }}</span>
            <span class="text-[11px] font-semibold text-gray-400 tabular-nums">{{ c.count }}</span>
          </button>
        }
      } @else {
        <p class="px-4 py-6 text-sm text-gray-400">No categories to filter by yet.</p>
      }
    </div>

    <div class="shrink-0 border-t border-gray-100 p-4 pb-[calc(1rem+env(safe-area-inset-bottom))] flex gap-3">
      <button type="button" (click)="categoryChange.emit('')" class="tap flex-1 border border-gray-300 rounded-lg py-2.5 text-sm font-semibold text-gray-600">Reset</button>
      <button type="button" (click)="closed.emit()" class="tap flex-[1.6] btn-primary py-2.5 text-sm">
        Show {{ resultCount() }} result{{ resultCount() === 1 ? '' : 's' }}
      </button>
    </div>
  </aside>
</div>
