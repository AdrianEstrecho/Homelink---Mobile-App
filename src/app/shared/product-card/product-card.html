<div class="card h-full flex flex-col">
  <div class="relative overflow-hidden bg-gray-100">
    <a [routerLink]="['/products', product().slug]" class="block">
      <app-safe-image [src]="product().image" [alt]="product().name" class="w-full h-32 object-cover" />
    </a>
    @if (product().featured) {
      <span class="absolute top-2 left-2 badge bg-brand-orange text-white text-[10px] flex items-center gap-1">
        <svg lucideStar class="w-3 h-3"></svg> Featured
      </span>
    }
    @if (outOfStock()) {
      <span class="absolute bottom-2 left-2 badge bg-gray-700 text-white text-[10px]">Out of Stock</span>
    } @else if (lowStock()) {
      <span class="absolute bottom-2 left-2 badge bg-red-500 text-white text-[10px]">Low Stock</span>
    }
    <button
      type="button"
      (click)="handleWishlistToggle($event)"
      [attr.aria-label]="(wishlisted() ? 'Remove ' : 'Add ') + product().name + (wishlisted() ? ' from wishlist' : ' to wishlist')"
      [attr.aria-pressed]="wishlisted()"
      class="tap absolute top-2 right-2 w-7 h-7 rounded-full bg-white/90 flex items-center justify-center shadow-sm"
    >
      <svg lucideHeart class="w-3.5 h-3.5" [class]="wishlisted() ? 'fill-red-500 text-red-500' : 'text-gray-500'"></svg>
    </button>
  </div>
  <div class="p-3 flex flex-col flex-1">
    <p class="text-[10px] text-brand-teal font-semibold uppercase tracking-wide mb-1">{{ product().category_name }}</p>
    <a [routerLink]="['/products', product().slug]">
      <h3 class="font-semibold text-sm text-brand-ink line-clamp-2 mb-1.5">{{ product().name }}</h3>
    </a>
    @if ((product().review_count ?? 0) > 0) {
      <div class="flex items-center gap-1.5 mb-1.5">
        <app-star-rating [value]="product().avg_rating ?? 0" [readOnly]="true" size="w-3 h-3" />
        <span class="text-[11px] text-gray-400">({{ product().review_count }})</span>
      </div>
    }
    <div class="flex items-center justify-between gap-2 mt-auto pt-1.5">
      <span class="text-sm font-bold text-brand-navy">{{ product().price | homelinkPrice }}</span>
      <button
        type="button"
        (click)="handleAdd()"
        [disabled]="outOfStock()"
        [attr.aria-label]="outOfStock() ? product().name + ' is out of stock' : 'Add ' + product().name + ' to cart'"
        class="tap flex items-center justify-center bg-brand-navy text-white w-7 h-7 rounded-lg shrink-0 disabled:opacity-50"
      >
        <svg lucideShoppingCart class="w-3.5 h-3.5"></svg>
      </button>
    </div>
  </div>
</div>

<app-confirm-dialog
  [open]="confirmUnfavorite()"
  title="Remove from wishlist?"
  [message]="'&quot;' + product().name + '&quot; will be removed from your saved items.'"
  confirmLabel="Remove"
  tone="delete"
  (confirmed)="confirmUnfavoriteAction()"
  (cancelled)="confirmUnfavorite.set(false)"
>
  <svg icon lucideHeart></svg>
</app-confirm-dialog>
<app-confirm-dialog
  [open]="confirmAddToCart()"
  title="Add to cart?"
  [message]="'&quot;' + product().name + '&quot; will be added to your cart and removed from your wishlist.'"
  confirmLabel="Add to Cart"
  tone="create"
  (confirmed)="confirmAddToCartAction()"
  (cancelled)="confirmAddToCart.set(false)"
>
  <svg icon lucideShoppingCart></svg>
</app-confirm-dialog>
