<nav class="app-bottomnav">
  <div class="grid grid-cols-5 h-16">
    @for (t of tabs; track t.to) {
      <a
        [routerLink]="t.to"
        routerLinkActive="text-brand-orange"
        [routerLinkActiveOptions]="{ exact: t.exact }"
        #rla="routerLinkActive"
        class="tap relative flex flex-col items-center justify-center gap-1 text-gray-400"
      >
        <span class="relative flex items-center justify-center w-6 h-6">
          @switch (t.icon) {
            @case ('house') { <svg lucideHouse class="w-5 h-5"></svg> }
            @case ('grid') { <svg lucideLayoutGrid class="w-5 h-5"></svg> }
            @case ('wrench') { <svg lucideWrench class="w-5 h-5"></svg> }
            @case ('cart') { <svg lucideShoppingCart class="w-5 h-5"></svg> }
            @case ('user') { <svg lucideUser class="w-5 h-5"></svg> }
          }
          @if (t.icon === 'cart' && cartCount() > 0) {
            <span class="absolute -top-1.5 -right-2 bg-brand-orange text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">{{ cartCount() > 9 ? '9+' : cartCount() }}</span>
          }
        </span>
        <span class="text-[11px] font-medium leading-none" [class]="rla.isActive ? 'text-brand-orange' : 'text-gray-500'">{{ t.label }}</span>
      </a>
    }
  </div>
</nav>
