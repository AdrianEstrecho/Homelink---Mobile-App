<div>
  <div class="flex items-center justify-between mb-5">
    <h2 class="flex items-center gap-2.5 text-sm font-semibold text-brand-ink">
      <span class="w-6 h-6 rounded-full bg-brand-navy text-white text-xs font-bold flex items-center justify-center shrink-0">{{ stepNumber() }}</span>
      {{ title() }}
    </h2>
    @if (!showForm() && options().length > 0) {
      <button type="button" (click)="openForm()" class="flex items-center gap-1 text-sm font-semibold text-brand-teal hover:underline">
        <svg lucidePlus class="w-3.5 h-3.5"></svg> Add New
      </button>
    }
  </div>

  @if (addresses() === null) {
    <p class="text-sm text-gray-400">Loading addresses...</p>
  } @else if (options().length > 0) {
    <div class="space-y-3">
      @for (a of options(); track a.id) {
        <label class="flex items-start gap-3 p-4 rounded-xl border cursor-pointer transition" [class]="selectedId() === a.id ? 'border-brand-orange bg-brand-orange/5' : 'border-gray-200 hover:border-gray-300'">
          <input type="radio" name="address" [checked]="selectedId() === a.id" (change)="selectedId.set(a.id)" class="mt-1 accent-brand-orange" />
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <p class="text-sm font-semibold text-brand-ink">{{ a.label }}</p>
              @if (a.is_default) {
                <span class="badge bg-brand-teal/15 text-brand-teal">Default</span>
              }
            </div>
            <p class="text-sm text-gray-500 mt-0.5">{{ a.fullAddress }}</p>
          </div>
        </label>
      }
    </div>
  }

  @if (showForm()) {
    <div class="p-4 rounded-xl bg-gray-50 border border-gray-100 space-y-4" [class.mt-4]="options().length > 0">
      <app-address-form-fields [form]="form()" (formChange)="form.set($event)" />
      @if (error()) {
        <p class="text-red-600 text-sm">{{ error() }}</p>
      }
      <div class="flex gap-2">
        <button type="button" (click)="handleSave()" [disabled]="saving()" class="btn-primary text-sm py-2 disabled:opacity-60">
          {{ saving() ? 'Saving...' : 'Save & Use This Address' }}
        </button>
        @if (options().length > 0) {
          <button type="button" (click)="cancelForm()" class="text-sm font-medium text-gray-500 hover:text-gray-700">Cancel</button>
        }
      </div>
    </div>
  }
</div>
