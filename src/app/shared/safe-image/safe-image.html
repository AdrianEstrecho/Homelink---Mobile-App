@if (failed()) {
  <div class="flex items-center justify-center bg-gray-100 text-gray-400" [class]="imgClass()">
    <svg lucideImageOff [class]="iconClass()"></svg>
  </div>
} @else {
  <img
    #img
    [src]="src()"
    [alt]="alt()"
    [class]="imgClass() + (loaded() ? ' img-in' : ' img-pending')"
    loading="lazy"
    (load)="onLoad()"
    (error)="onError()"
  />
}
