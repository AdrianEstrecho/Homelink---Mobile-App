<div #lane class="relative w-full h-[176px] overflow-hidden select-none">
  @for (c of clouds; track c.delay) {
    <div aria-hidden="true" class="lane-cloud absolute left-0" [style.top]="c.top" [style.animation-duration]="c.duration + 's'" [style.animation-delay]="c.delay + 's'">
      <svg [attr.width]="c.width" viewBox="0 0 120 44">
        <g fill="#0f2b5b" opacity=".07">
          <circle cx="34" cy="28" r="14" />
          <circle cx="58" cy="20" r="18" />
          <circle cx="84" cy="28" r="13" />
          <rect x="34" y="28" width="50" height="14" />
        </g>
      </svg>
    </div>
  }

  <div class="absolute inset-x-0 top-2 pointer-events-none">
    <div class="px-4 flex items-center justify-between gap-3">
      <span id="lane-hint" class="inline-flex items-center gap-1.5 rounded-full border border-gray-200 bg-white/80 backdrop-blur px-3 py-1 text-xs text-gray-600">
        <svg lucideHand class="w-3.5 h-3.5 text-brand-orange"></svg>
        Drag or tap the truck
      </span>
      <span aria-hidden="true" class="inline-flex items-center gap-1.5 rounded-full border border-gray-200 bg-white/80 backdrop-blur px-3 py-1 text-xs text-gray-600">
        <svg lucideGauge class="w-3.5 h-3.5 text-brand-teal"></svg>
        <span #speed class="font-semibold tabular-nums text-brand-navy">0</span> km/h
      </span>
    </div>
  </div>

  <div
    aria-hidden="true"
    class="absolute inset-x-0 bottom-[58px] h-[70px] bg-repeat-x"
    [style.background-image]="skyline"
    style="background-size: auto 100%; background-position: left bottom"
  ></div>
  <div
    aria-hidden="true"
    class="absolute inset-x-0 bottom-12 h-2.5 bg-[#e7e2d8] border-b-2 border-[#cfc8ba]"
    style="background-image: repeating-linear-gradient(90deg, transparent 0 30px, rgba(15, 43, 91, 0.08) 30px 31px)"
  ></div>
  <div aria-hidden="true" class="absolute inset-x-0 bottom-0 h-12 bg-[#1c2536] border-b-[3px] border-[#cbd5e1]">
    <div
      class="absolute inset-x-0 top-[62%] -translate-y-1/2 h-[3px]"
      style="background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.5) 0 26px, transparent 26px 52px)"
    ></div>
  </div>

  <div #truck class="absolute left-0 bottom-1 w-[190px] will-change-transform">
    @if (honks() > 0) {
      <span class="absolute bottom-full left-[84%] -translate-x-1/2 mb-1 pointer-events-none" aria-hidden="true">
        @for (h of [honks()]; track h) {
          <span class="lane-honk relative block whitespace-nowrap rounded-full bg-white px-2.5 py-1 text-xs font-bold text-brand-navy shadow-md">
            Beep beep!
            <span class="absolute left-1/2 top-full -translate-x-1/2 border-x-[5px] border-t-[6px] border-x-transparent border-t-white"></span>
          </span>
        }
      </span>
    }
    <span aria-hidden="true" class="absolute left-0 bottom-[22%] flex">
      @for (d of [0, 0.4, 0.8]; track d) {
        <span class="lane-puff absolute w-2.5 h-2.5 rounded-full bg-gray-400/50" [style.animation-delay]="d + 's'"></span>
      }
    </span>
    <button
      type="button"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="endDrag()"
      (pointercancel)="endDrag()"
      (lostpointercapture)="endDrag()"
      (click)="onClick()"
      (keydown)="onKeyDown($event)"
      aria-label="Honk the HomeLink delivery truck"
      aria-describedby="lane-hint"
      class="block w-full rounded-xl touch-pan-y"
    >
      <span #hop class="block">
        <span #lean class="block origin-bottom">
          <svg [attr.viewBox]="truckViewBox" class="block w-full h-auto overflow-visible" aria-hidden="true">
            <g appDeliveryTruck bodyClass="lane-bob" />
          </svg>
        </span>
      </span>
    </button>
  </div>
</div>
