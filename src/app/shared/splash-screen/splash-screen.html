<div class="splash app-overlay-frame" [class.splash-out]="leaving()" role="status" aria-label="HomeLink is starting">
  <span class="splash-grid" aria-hidden="true"></span>
  <span class="splash-glow splash-glow-a" aria-hidden="true"></span>
  <span class="splash-glow splash-glow-b" aria-hidden="true"></span>
  <span class="splash-vignette" aria-hidden="true"></span>

  <div class="relative flex flex-1 flex-col items-center justify-center px-10">
    <div class="splash-stage">
      <!-- Site-plan rings: one dashed and slowly turning, one steady. -->
      <svg class="splash-plan" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="92" />
      </svg>
      <svg class="splash-plan splash-plan-steady" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="73" />
      </svg>

      <!-- The trades, arriving around the house. -->
      <span class="splash-chip splash-chip-tl" aria-hidden="true">
        <span class="splash-chip-in"><svg lucideSnowflake class="w-3.5 h-3.5"></svg></span>
      </span>
      <span class="splash-chip splash-chip-tr" aria-hidden="true">
        <span class="splash-chip-in"><svg lucideSun class="w-3.5 h-3.5"></svg></span>
      </span>
      <span class="splash-chip splash-chip-bl" aria-hidden="true">
        <span class="splash-chip-in"><svg lucideDroplets class="w-3.5 h-3.5"></svg></span>
      </span>
      <span class="splash-chip splash-chip-br" aria-hidden="true">
        <span class="splash-chip-in"><svg lucideZap class="w-3.5 h-3.5"></svg></span>
      </span>

      <!-- The HomeLink mark, built in order: the house is traced and filled, its windows
           light up, then the wrench swings in beneath it and gives a turn. Drawn from the
           same paths as shared/logo-mark rather than through it, so each part can be
           animated on its own. -->
      <span class="splash-halo" aria-hidden="true"></span>
      <svg class="splash-mark" [attr.viewBox]="viewBox" aria-hidden="true">
        <path class="mark-house" [attr.d]="housePath" pathLength="1" />
        @for (p of panes; track $index; let i = $index) {
          <rect class="mark-pane" [attr.x]="p[0]" [attr.y]="p[1]" width="15.5" height="15.5" rx="1.2" [style.animation-delay]="0.9 + i * 0.07 + 's'" />
        }
        <path class="mark-wrench" [attr.d]="wrenchPath" />
      </svg>
    </div>

    <h1 class="splash-wordmark font-display">Home<span class="text-brand-orange">Link</span></h1>
    <p class="splash-tagline">Shop it. Book it. Done.</p>

    <div class="splash-bar" aria-hidden="true"><span></span></div>
  </div>

  <div class="splash-foot">
    <p class="text-[11px] text-white/45 tracking-wide">Products &amp; verified technicians, in one app</p>
    <p class="text-[10px] text-white/25 mt-1 tabular-nums">Version {{ version }}</p>
  </div>
</div>
