<ul class="grid grid-cols-2 gap-x-3 gap-y-1 text-xs mt-1.5">
  @for (rule of rules; track rule.key) {
    <li class="flex items-center gap-1.5" [class]="isMet(rule.test) ? 'text-green-600' : 'text-gray-400'">
      @if (isMet(rule.test)) {
        <svg lucideCheck class="w-3.5 h-3.5 shrink-0"></svg>
      } @else {
        <svg lucideX class="w-3.5 h-3.5 shrink-0"></svg>
      }
      {{ rule.label }}
    </li>
  }
</ul>
