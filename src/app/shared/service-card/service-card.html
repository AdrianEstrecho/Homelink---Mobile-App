<div class="card h-full flex flex-col">
  <div class="relative h-28 overflow-hidden bg-gray-100">
    <app-safe-image [src]="service().image" [alt]="service().name" class="w-full h-full object-cover" />
    <div class="absolute inset-0 bg-gradient-to-t from-brand-navy/80 to-transparent"></div>
    <span class="absolute bottom-2 left-2 badge bg-brand-teal text-white text-[10px]">{{ service().category }}</span>
  </div>
  <div class="p-3 flex flex-col flex-1">
    <h3 class="font-display font-bold text-brand-ink text-sm mb-1 line-clamp-1">{{ service().name }}</h3>
    <p class="text-gray-500 text-xs mb-2 line-clamp-2 leading-relaxed">{{ service().description }}</p>
    <div class="flex items-center justify-between text-xs text-gray-500 mb-3 mt-auto pt-2 border-t border-gray-100">
      <span class="flex items-center gap-1"><svg lucideClock class="w-3.5 h-3.5"></svg> ~{{ service().duration_hours | number: '1.1-1' }}h</span>
      <span class="font-bold text-brand-orange text-sm">{{ service().base_price | homelinkPrice }}</span>
    </div>
    <a [routerLink]="['/services', service().slug, 'book']" class="tap flex items-center justify-center gap-1.5 w-full btn-primary text-xs py-2">
      <svg lucideWrench class="w-3.5 h-3.5"></svg> Book Service
    </a>
  </div>
</div>
