<div class="card hover:border-brand-navy/20 hover:shadow-md group h-full flex flex-col">
  <div class="relative h-40 overflow-hidden bg-gray-100">
    <app-safe-image [src]="service().image" [alt]="service().name" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
    <div class="absolute inset-0 bg-gradient-to-t from-brand-navy/80 to-transparent"></div>
    <span class="absolute bottom-3 left-3 badge bg-brand-teal text-white">{{ service().category }}</span>
  </div>
  <div class="p-5 flex flex-col flex-1">
    <h3 class="font-display font-bold text-brand-ink text-lg mb-2">{{ service().name }}</h3>
    <p class="text-gray-500 text-sm mb-4 line-clamp-2 leading-relaxed">{{ service().description }}</p>
    <div class="flex items-center gap-4 text-sm text-gray-500 mb-4 mt-auto pt-3 border-t border-gray-100">
      <span class="flex items-center gap-1"><svg lucideClock class="w-4 h-4"></svg> ~{{ service().duration_hours | number: '1.1-1' }}h</span>
      <span class="font-bold text-brand-orange text-base">{{ service().base_price | homelinkPrice }}</span>
    </div>
    <a [routerLink]="['/services', service().slug, 'book']" class="flex items-center justify-center gap-2 w-full btn-primary text-sm py-2">
      <svg lucideWrench class="w-4 h-4"></svg> Book Service <svg lucideArrowRight class="w-4 h-4"></svg>
    </a>
  </div>
</div>
