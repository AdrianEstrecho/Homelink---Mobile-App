@if (open()) {
  <div class="fixed inset-0 z-[110] flex items-center justify-center p-4">
    <div class="modal-scrim" (click)="cancel()"></div>
    <form (submit)="$event.preventDefault(); submit()" class="modal-panel w-full max-w-sm p-6 fade-up">
      <div class="w-12 h-12 rounded-full flex items-center justify-center mb-4 bg-red-100 text-red-600">
        <svg lucideTriangleAlert class="w-6 h-6"></svg>
      </div>
      <h2 class="font-display text-lg font-bold text-brand-navy">{{ title() }}</h2>
      @if (message()) {
        <p class="text-sm text-gray-600 mt-1.5">{{ message() }}</p>
      }

      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mt-4 mb-1.5">
        Reason for cancellation
      </label>
      <textarea
        autofocus
        rows="3"
        [ngModel]="reason()"
        (ngModelChange)="onReasonInput($event)"
        name="reason"
        placeholder="Let us know what changed..."
        [disabled]="submitting()"
        class="input-field resize-none disabled:opacity-60"
      ></textarea>
      @if (error()) {
        <p class="text-sm text-red-600 mt-2">{{ error() }}</p>
      }

      <div class="flex gap-3 mt-6">
        <button type="button" (click)="cancel()" [disabled]="submitting()" class="flex-1 border border-gray-300 rounded-lg py-2.5 font-medium text-sm text-gray-700 hover:bg-gray-50 transition disabled:opacity-50">
          Keep It
        </button>
        <button type="submit" [disabled]="submitting()" class="flex-1 rounded-lg py-2.5 font-semibold text-sm text-white bg-red-600 hover:bg-red-700 transition disabled:opacity-50">
          {{ submitting() ? 'Submitting...' : 'Submit' }}
        </button>
      </div>
    </form>
  </div>
}
