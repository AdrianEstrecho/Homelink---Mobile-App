<div class="card divide-y divide-gray-100 overflow-hidden">
  @for (item of faqs(); track item.id; let i = $index) {
    @let isOpen = open() === i;
    <div class="relative transition-colors duration-300" [class]="isOpen ? 'bg-brand-orange/[0.04]' : ''">
      <span
        class="absolute left-0 inset-y-0 w-1 bg-brand-orange origin-top transition-transform duration-300"
        [class]="isOpen ? 'scale-y-100' : 'scale-y-0'"
        aria-hidden="true"
      ></span>
      <button
        type="button"
        (click)="toggle(i)"
        [attr.aria-expanded]="isOpen"
        class="tap w-full flex items-center justify-between gap-3 px-4 py-4 text-left"
      >
        <span class="font-display font-bold text-sm text-brand-ink">{{ item.question }}</span>
        <span
          class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 transition-all duration-300"
          [class]="isOpen ? 'bg-brand-orange text-white rotate-180' : 'bg-brand-light text-gray-400'"
        >
          <svg lucideChevronDown class="w-4 h-4"></svg>
        </span>
      </button>
      <div class="grid transition-[grid-template-rows] duration-300 ease-in-out" [style.grid-template-rows]="isOpen ? '1fr' : '0fr'">
        <div class="overflow-hidden">
          <p class="text-gray-500 text-sm leading-relaxed px-4 pb-4 pr-12">{{ item.answer }}</p>
        </div>
      </div>
    </div>
  }
</div>
