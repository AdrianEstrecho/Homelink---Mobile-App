<nav class="sticky top-0 z-50 bg-gradient-to-b from-brand-navy/95 to-brand-navy/80 backdrop-blur-xl border-b border-white/10 transition-[background-color,box-shadow,border-color,backdrop-filter] duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="flex items-center justify-between h-20">
      <a routerLink="/" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 bg-brand-orange rounded-lg flex items-center justify-center group-hover:scale-105 transition">
          <svg lucideHouse class="w-5 h-5 text-white"></svg>
        </div>
        <span class="font-display font-extrabold text-xl tracking-tight text-white">Home<span class="text-brand-orange">Link</span></span>
      </a>

      <div class="hidden md:flex items-stretch gap-8 h-full">
        @for (link of navLinks; track link.to) {
          <a
            [routerLink]="link.to"
            routerLinkActive="text-white"
            [routerLinkActiveOptions]="{ exact: link.to === '/' }"
            #rla="routerLinkActive"
            class="relative flex items-center text-sm font-medium tracking-wide transition"
            [class]="rla.isActive ? 'text-white' : 'text-white/70 hover:text-white'"
          >
            {{ link.label }}
            @if (rla.isActive) {
              <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-brand-orange"></span>
            }
          </a>
        }
      </div>

      <div class="flex items-center gap-3">
        <a routerLink="/login" class="hidden md:flex items-center gap-1.5 btn-primary text-sm py-2 px-4">
          <svg lucideUser class="w-4 h-4"></svg> Login
        </a>
        <button
          type="button"
          class="md:hidden p-2 rounded-lg text-white hover:bg-white/10 transition"
          (click)="toggleMobile()"
          [attr.aria-expanded]="mobileOpen()"
          [attr.aria-label]="mobileOpen() ? 'Close menu' : 'Open menu'"
        >
          @if (!mobileOpen()) {
            <svg lucideMenu></svg>
          } @else {
            <svg lucideX></svg>
          }
        </button>
      </div>
    </div>
  </div>

  <div
    class="md:hidden bg-gradient-to-b from-brand-navy/95 to-brand-navy/90 backdrop-blur-xl text-white overflow-hidden transition-[max-height,opacity] duration-300 ease-out"
    [class]="mobileOpen() ? 'max-h-[420px] opacity-100 border-t border-white/10' : 'max-h-0 opacity-0'"
  >
    <div class="px-4 py-4 space-y-1">
      @for (link of navLinks; track link.to) {
        <a
          [routerLink]="link.to"
          routerLinkActive="bg-white/10 text-brand-orange"
          [routerLinkActiveOptions]="{ exact: link.to === '/' }"
          class="block px-2 py-2 rounded-lg transition hover:bg-white/5"
          (click)="closeMobile()"
        >
          {{ link.label }}
        </a>
      }
      <a routerLink="/login" class="block px-2 py-2 rounded-lg text-brand-orange font-semibold hover:bg-white/5" (click)="closeMobile()">
        Login / Register
      </a>
    </div>
  </div>
</nav>
