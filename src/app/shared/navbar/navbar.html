<header class="app-topbar">
  <div class="h-14 flex items-center gap-2 px-4">
    @if (!isTabRoot()) {
      <button type="button" (click)="goBack()" aria-label="Go back" class="tap -ml-2 mr-1 p-2 rounded-full active:bg-white/10">
        <svg lucideArrowLeft class="w-5 h-5"></svg>
      </button>
    } @else if (isHome()) {
      <div class="w-8 h-8 bg-brand-orange rounded-lg flex items-center justify-center shrink-0 mr-0.5">
        <svg lucideHouse class="w-4.5 h-4.5 text-white"></svg>
      </div>
    }
    <h1 class="font-display font-bold text-lg truncate flex-1">
      @if (isHome()) {
        Home<span class="text-brand-orange">Link</span>
      } @else {
        {{ pageTitle() }}
      }
    </h1>
    @if (!auth.loading() && !auth.user()) {
      <a
        routerLink="/login"
        class="tap shrink-0 flex items-center gap-1.5 text-sm font-semibold px-3 py-1.5 rounded-full bg-brand-orange text-white active:opacity-80"
      >
        <svg lucideLogIn class="w-3.5 h-3.5"></svg>
        Login
      </a>
    }
  </div>
</header>
